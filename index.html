<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Meta -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NoteNest</title>

  <!-- Icons -->
  <!-- Attribution: Boxicons https://boxicons.com/ -->
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1 class="visually-hidden">NoteNest</h1>
  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar">

    <!-- Logo -->
    <div class="logo">
      <i class='bx bx-note'></i>
      <span class="logo-text">NoteNest</span>
    </div>

    <!-- Navigation -->
    <nav class="nav-links">

      <a href="#" class="nav-item active">
        <i class='bx bx-notepad'></i>
        <span>All Notes</span>
      </a>

      <a href="#" class="nav-item">
        <i class='bx bx-star'></i>
        <span>Favorites</span>
      </a>

      <a href="#" class="nav-item">
        <i class='bx bx-purchase-tag'></i>
        <span>Tags</span>
      </a>

      <a href="#" class="nav-item">
        <i class='bx bx-trash'></i>
        <span>Bin</span>
      </a>

    </nav>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main-content">

    <!-- Top Bar -->
    <header class="topbar">

      <button class="theme-toggle" id="themeToggle">
       <i class='bx bx-moon'></i>
      </button>

      <div class="search-box">
        <i class='bx bx-search'></i>
        <input type="text" placeholder="Search notes...">
      </div>

    </header>

    <!-- New Note Section -->
    <section class="new-note-section" aria-labelledby="create-note-heading">
  <h2 id="create-note-heading" class="visually-hidden">Create a new note</h2>

      <button class="new-note-btn" id="newNoteBtn">
        <i class='bx bx-plus'></i>
        New Note
      </button>

      <!-- Note Options Popup -->
      <div class="note-options hidden" id="noteOptions">

        <button class="option-btn" data-type="text">
          <i class='bx bx-text'></i>
          Writing Note
        </button>

        <button class="option-btn" data-type="drawing">
          <i class='bx bx-pencil'></i>
          Drawing Note
        </button>

        <button class="option-btn" data-type="image">
          <i class='bx bx-image'></i>
          Image Note
        </button>
        
        <button class="empty-bin-btn hidden" id="emptyBinBtn">
            <i class='bx bx-trash'></i>
            Empty Bin
        </button>

      </div>

    </section>

    <!-- Notes Grid -->
    <section class="notes-grid" id="notesGrid" aria-labelledby="notes-heading">
  <h2 id="notes-heading" class="visually-hidden">Saved notes</h2>

      <!-- Notes will appear here dynamically -->

    </section>

  </main>

  <!-- ================= NOTE MODAL ================= -->
  <div class="modal hidden" id="noteModal">

    <div class="modal-content">

      <div class="modal-header">
        <h2>Create Note</h2>

        <button class="close-btn" id="closeModal">
          <i class='bx bx-x'></i>
        </button>
      </div>

      <!-- Title -->
      <input
        type="text"
        id="noteTitle"
        class="note-title-input"
        placeholder="Note title..."
      >

      <!-- Text -->
      <textarea
        id="noteText"
        class="note-textarea"
        placeholder="Write your note..."
      ></textarea>

      <input
        type="text"
        id="noteTags"
        class="note-tags-input"
        placeholder="Tags separated by commas, e.g. school, ideas, work"
      >

      <div class="image-upload hidden" id="imageUploadBox">
        <label for="imageInput" class="image-label">
          Upload image
        </label>

        <input
          type="file"
          id="imageInput"
          accept="image/*"
         >

        <img id="imagePreview" class="image-preview hidden" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
          alt="Image preview">
      </div>

      <div class="drawing-box hidden" id="drawingBox">
        <div class="drawing-toolbar">
            <label for="penColor">Pen</label>
            <input type="color" id="penColor" value="#ffffff">

            <label for="penSize">Size</label>
            <input type="range" id="penSize" min="2" max="18" value="4">

            <button type="button" id="clearCanvasBtn" class="clear-canvas-btn">
                Clear
            </button>
        </div>

        <canvas id="drawingCanvas" width="560" height="300"></canvas>
      </div>

      <!-- Actions -->
      <div class="modal-actions">

        <button class="favorite-btn">
          <i class='bx bx-star'></i>
        </button>

        <button class="save-note-btn" id="saveNoteBtn">
          Save Note
        </button>

      </div>

    </div>
  </div>

  <!-- JS -->
  <script src="js/app.js"></script>

</body>
</html>
